version: 2

updates:
  # 插件本体：运行时依赖与开发依赖分别归组，安全更新与版本更新也分开，
  # 每类最多一个 PR，避免多个 PR 同时改 package-lock.json 相互冲突。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # peerDependencies 固定为 hydrooj ^4，大版本升级需人工评估兼容性
      - dependency-name: hydrooj
        update-types: [version-update:semver-major]
      # 运行时使用 Hydro 自带的 js-yaml 4.x，devDependency 需保持同一大版本
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]
    groups:
      runtime-security:
        applies-to: security-updates
        dependency-type: production
      dev-security:
        applies-to: security-updates
        dependency-type: development
      # 0.x 包的 minor 升级按 semver 可能不兼容，不随 runtime 组一起合并；
      # 不用 ignore 是因为 ignore 也会拦截安全更新
      katex:
        applies-to: version-updates
        patterns: [katex]
      runtime:
        applies-to: version-updates
        dependency-type: production
        exclude-patterns: [katex]
        update-types: [minor, patch]
      # parser 与 eslint-plugin 必须同版本，大版本升级放在同一个 PR
      typescript-eslint:
        applies-to: version-updates
        patterns: ["@typescript-eslint/*"]
      dev:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cloudflare/telemetry-dashboard
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      dashboard-security:
        applies-to: security-updates
        patterns: ["*"]
      dashboard:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
