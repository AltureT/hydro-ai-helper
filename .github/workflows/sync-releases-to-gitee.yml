name: Sync Releases to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Stable tag to sync (for example, v3.1.0)'
        required: true

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        env:
          DISPATCH_TAG_NAME: ${{ github.event.inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EVENT_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$DISPATCH_TAG_NAME"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG_NAME="$RELEASE_EVENT_TAG_NAME"
          else
            printf 'Unsupported workflow event: %s\n' "$EVENT_NAME" >&2
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid stable release tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

          gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" > /tmp/release_info.json
          jq -e --arg tag "$TAG_NAME" 'type == "object" and .tag_name == $tag' /tmp/release_info.json > /dev/null
          jq -rj '.name // .tag_name' /tmp/release_info.json > /tmp/release_name.txt
          jq -rj '.body // ""' /tmp/release_info.json > /tmp/release_body.txt
          PRERELEASE="$(jq -r '.prerelease' /tmp/release_info.json)"

          if [ "$PRERELEASE" != "true" ] && [ "$PRERELEASE" != "false" ]; then
            printf 'Invalid prerelease value for %s\n' "$TAG_NAME" >&2
            exit 1
          fi

          printf 'tag_name=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check if release exists on Gitee
        id: check
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid stable release tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/gitee_check.json \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode "access_token=${GITEE_ACCESS_TOKEN}" \
            "https://gitee.com/api/v5/repos/alture/hydro-ai-helper/releases/tags/${TAG_NAME}")"

          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID="$(jq -r '.id // empty' /tmp/gitee_check.json)"
            if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
              printf 'exists=true\n' >> "$GITHUB_OUTPUT"
              printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"
            else
              printf 'exists=false\n' >> "$GITHUB_OUTPUT"
              printf 'release_id=\n' >> "$GITHUB_OUTPUT"
            fi
          elif [ "$HTTP_CODE" = "404" ]; then
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            printf 'release_id=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Gitee release lookup failed with HTTP %s\n' "$HTTP_CODE" >&2
            exit 1
          fi

      - name: Create or Update release on Gitee
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_EXISTS: ${{ steps.check.outputs.exists }}
          RELEASE_ID: ${{ steps.check.outputs.release_id }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid stable release tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi
          if [ "$PRERELEASE" != "true" ] && [ "$PRERELEASE" != "false" ]; then
            printf 'Invalid prerelease value for %s\n' "$TAG_NAME" >&2
            exit 1
          fi
          if [ "$RELEASE_EXISTS" != "true" ] && [ "$RELEASE_EXISTS" != "false" ]; then
            printf 'Invalid Gitee release existence value\n' >&2
            exit 1
          fi
          if [ "$RELEASE_EXISTS" = "true" ] && [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            printf 'Invalid Gitee release id\n' >&2
            exit 1
          fi

          jq -n \
            --arg token "$GITEE_ACCESS_TOKEN" \
            --arg tag "$TAG_NAME" \
            --rawfile name /tmp/release_name.txt \
            --rawfile body /tmp/release_body.txt \
            --arg branch "main" \
            --argjson prerelease "$PRERELEASE" \
            '{
              access_token: $token,
              tag_name: $tag,
              name: $name,
              body: $body,
              target_commitish: $branch,
              prerelease: $prerelease
            }' > /tmp/gitee_payload.json

          if [ "$RELEASE_EXISTS" = "true" ]; then
            METHOD="PATCH"
            ENDPOINT="https://gitee.com/api/v5/repos/alture/hydro-ai-helper/releases/${RELEASE_ID}"
          else
            METHOD="POST"
            ENDPOINT="https://gitee.com/api/v5/repos/alture/hydro-ai-helper/releases"
          fi

          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/gitee_response.json \
            --write-out '%{http_code}' \
            -X "$METHOD" \
            "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/gitee_payload.json)"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            printf 'Gitee release sync failed with HTTP %s\n' "$HTTP_CODE" >&2
            exit 1
          fi

          printf 'Gitee release %s completed for %s\n' "$METHOD" "$TAG_NAME"
