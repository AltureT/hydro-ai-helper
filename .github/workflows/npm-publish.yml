name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v1.8.5 等格式的 tag

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 需要写入权限以创建 Release
      actions: write   # 创建 Release 后显式触发 Gitee 镜像同步
      id-token: write  # npm provenance attestation

    steps:
      - name: Checkout 代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: npm ci

      - name: 验证受信任的发布引用
        run: node scripts/verifyReleaseRef.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: 测试
        run: npm test -- --runInBand --silent

      - name: 构建插件
        run: npm run build:plugin

      - name: 验证版本一致性
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ 错误：Tag 版本 ($TAG_VERSION) 与 package.json 版本 ($PKG_VERSION) 不一致"
            exit 1
          fi

          echo "✅ 版本验证通过：$TAG_VERSION"

      - name: 提取当前版本发布说明
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          awk -v heading="## ${TAG_NAME}" '
            $0 == heading { found = 1; next }
            found && /^## v[0-9]+\.[0-9]+\.[0-9]+/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "❌ 错误：CHANGELOG.md 中未找到 ${TAG_NAME} 的发布说明"
            exit 1
          fi

          echo "✅ 已提取 ${TAG_NAME} 的独立发布说明"

      - name: 发布到 npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Curated, user-facing notes only. Auto-generation is OFF so internal
          # commit titles (infra/telemetry/etc.) are never surfaced publicly.
          # The extraction step selects only the section matching the current tag.
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 触发 Gitee Release 同步
        run: gh workflow run sync-releases-to-gitee.yml --ref main -f tag_name="${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布成功通知
        if: success()
        run: |
          echo "🎉 成功发布 ${{ github.ref_name }} 到 npm"
          echo "📦 npm: https://www.npmjs.com/package/hydro-ai-helper"
          echo "🏷️ GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: 发布失败通知
        if: failure()
        run: |
          echo "❌ 发布失败，请检查日志"
          echo "可能的原因："
          echo "1. NPM_TOKEN 未配置或已过期"
          echo "2. 版本号与 package.json 不一致"
          echo "3. npm 包名已被占用"
